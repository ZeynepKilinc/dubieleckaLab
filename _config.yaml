# site properties and page defaults
title: DUBIELECKA LAB
subtitle: 
show-title: false
show-subtitle: false
logo-text: false
description: The Dubielecka Lab studies age-related hematologic malignancies, inflammatory signaling, and disease-initiating hematopoietic stem cells.
baseurl: /dubieleckaLab
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  orcid: 0000-0001-8713-9213
  google-scholar: https://scholar.google.com/citations?user=Qt3a2qkAAAAJ&hl=en

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
